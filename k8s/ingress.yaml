apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser
  namespace: app
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: command-parser
                port:
                  number: 8000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: command-parser
                port:
                  number: 8000
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: command-parser
                port:
                  number: 8000
