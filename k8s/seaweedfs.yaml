apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-s3", "-dir=/data", "-ip=0.0.0.0"]
          ports:
            - name: master
              containerPort: 9333
            - name: filer
              containerPort: 8888
            - name: s3
              containerPort: 8333
          volumeMounts:
            - name: store
              mountPath: /data
      volumes:
        - name: store
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: filer
      port: 8888
      targetPort: 8888
